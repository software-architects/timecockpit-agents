name: timecockpit
version: 0.2.0
description: Skills, agents, and MCP configuration for time cockpit users and administrators working with AI agents.
author: software architects gmbh
dependencies:
  apm: []
  mcp:
    - name: timecockpit
      registry: false
      transport: http
      url: https://mcp.timecockpit.com
      # The OAuth client id is user-specific and is not shipped here. After `apm install`,
      # add it to the generated entry (Claude Code: "oauth": { "clientId": "<your-client-id>" });
      # see skills/timecockpit-mcp-setup/references/client-configs.md.
includes: auto
scripts: {}

marketplace:
  name: time cockpit
  description: Skills, agents, and MCP access for working with time cockpit through AI agents.
  owner:
    name: software architects gmbh
    url: https://github.com/software-architects
  build:
    tagPattern: "v{version}"
  outputs:
    codex:
      path: .agents/plugins/marketplace.json
  packages:
    - name: timecockpit
      description: Skills and MCP access for working with time cockpit.
      source: ./
      category: Productivity
